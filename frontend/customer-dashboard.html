<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - RentEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚜 RentEase</h1>
            <p>Browse and rent equipment easily</p>
            <div class="nav-container">
                <button class="nav-btn active" onclick="showSection('browse')">🔍 Browse Equipment</button>
                <button class="nav-btn" onclick="showSection('my-rentals')">📋 My Rentals</button>
                <button class="nav-btn" onclick="showSection('profile')">👤 My Profile</button>
                <button class="nav-btn logout" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Profile Section -->
        <section id="profile" class="content-section">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar" id="profile-avatar">U</div>
                    <div class="profile-info">
                        <h2 id="profile-name">Loading...</h2>
                        <p id="profile-email">Loading...</p>
                    </div>
                </div>
                
                <form id="profile-form" onsubmit="updateProfile(event)">
                    <div class="profile-details">
                        <div class="detail-item">
                            <label>Full Name</label>
                            <input type="text" id="edit-name" required>
                        </div>
                        <div class="detail-item">
                            <label>Email Address</label>
                            <input type="email" id="edit-email" required>
                        </div>
                        <div class="detail-item">
                            <label>Phone Number</label>
                            <input type="tel" id="edit-phone" required>
                        </div>
                        <div class="detail-item">
                            <label>Address</label>
                            <input type="text" id="edit-address" required>
                        </div>
                    </div>
                    <div class="mt-20">
                        <button type="submit" class="btn-primary">💾 Update Profile</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Browse Equipment Section -->
        <section id="browse" class="content-section active">
            <h2>🛠️ Available Equipment</h2>
            <div id="equipment-grid" class="equipment-grid">
                <div class="loading">Loading available equipment...</div>
            </div>
        </section>

        <!-- My Rentals Section -->
        <section id="my-rentals" class="content-section">
            <h2>📋 My Active Rentals</h2>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Equipment</th>
                            <th>Rental Date</th>
                            <th>Due Date</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="my-rentals-list">
                        <tr><td colspan="5" class="loading">Loading your rentals...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Rental Modal -->
    <div id="rental-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🚜 Rent Equipment</h3>
                <span class="close" onclick="closeRentalModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="selected-equipment-info"></div>
                <form onsubmit="confirmRental(event)">
                    <div class="input-group">
                        <label for="rental-days">Number of Days:</label>
                        <input type="number" id="rental-days" min="1" max="365" required>
                    </div>
                    <div id="rental-calculation" class="calculation-info"></div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeRentalModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Confirm Rental</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="customer.js"></script>
</body>
</html>
